# Standalone AMD GPU compose — GENERATED from docker-compose.yml + docker/gpu.amd.yml.
# Source of truth is the base compose + overlay; regenerate, don't hand-edit.
# (Inlined for stack UIs that accept only a single compose file.)
services:
  odysseus:
    build:
      context: ${ODYSSEUS_REPO_DIR:-.}
      args:
        INSTALL_EXTRA_DEPS: ${INSTALL_EXTRA_DEPS:-true}
        INSTALL_OPTIONAL: ${INSTALL_OPTIONAL:-false}
    ports:
    - ${APP_BIND:-127.0.0.1}:${APP_PORT:-7000}:7000
    volumes:
    - ${APP_DATA_DIR:-./data}:/app/data:z
    - ${APP_LOGS_DIR:-./logs}:/app/logs:z
    - ${APP_DATA_DIR:-./data}/ssh:/app/.ssh:z
    - ${APP_DATA_DIR:-./data}/huggingface:/app/.cache/huggingface:z
    - ${APP_DATA_DIR:-./data}/local:/app/.local:z
    extra_hosts:
    - host.docker.internal:host-gateway
    environment:
    - LLM_HOST=${LLM_HOST:-localhost}
    - LLM_HOSTS=${LLM_HOSTS:-}
    - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-}
    - RESEARCH_LLM_ENDPOINT=${RESEARCH_LLM_ENDPOINT:-}
    - HF_TOKEN=${HF_TOKEN:-}
    - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
    - SEARXNG_INSTANCE=http://searxng:8080
    - CHROMADB_HOST=chromadb
    - CHROMADB_PORT=8000
    - DATABASE_URL=${DATABASE_URL:-sqlite:///./data/app.db}
    - AUTH_ENABLED=${AUTH_ENABLED:-true}
    - LOCALHOST_BYPASS=${LOCALHOST_BYPASS:-false}
    - ODYSSEUS_ADMIN_USER=${ODYSSEUS_ADMIN_USER:-admin}
    - ODYSSEUS_ADMIN_PASSWORD=${ODYSSEUS_ADMIN_PASSWORD:-}
    - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1}
    - SECURE_COOKIES=${SECURE_COOKIES:-false}
    - EMBEDDING_URL=${EMBEDDING_URL:-}
    - EMBEDDING_MODEL=${EMBEDDING_MODEL:-}
    - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
    - FASTEMBED_MODEL=${FASTEMBED_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
    - FASTEMBED_CACHE_PATH=${FASTEMBED_CACHE_PATH:-}
    - CLEANUP_INTERVAL_HOURS=${CLEANUP_INTERVAL_HOURS:-24}
    - ODYSSEUS_INPROCESS_POLLERS=${ODYSSEUS_INPROCESS_POLLERS:-1}
    - ODYSSEUS_INPROCESS_TASKS=${ODYSSEUS_INPROCESS_TASKS:-1}
    - ODYSSEUS_SCRIPT_HOST=${ODYSSEUS_SCRIPT_HOST:-localhost}
    - ODYSSEUS_CHAT_UPLOAD_MAX_BYTES=${ODYSSEUS_CHAT_UPLOAD_MAX_BYTES:-10485760}
    - TZ=${TZ:-Europe/Zurich}
    - ODYSSEUS_PUBLIC_URL=${ODYSSEUS_PUBLIC_URL:-}
    - ODYSSEUS_USERCONTENT_ORIGIN=${ODYSSEUS_USERCONTENT_ORIGIN:-}
    - ODYSSEUS_USERCONTENT_SECRET=${ODYSSEUS_USERCONTENT_SECRET:-}
    - ODYSSEUS_ICS_BLOCK_PRIVATE_IPS=${ODYSSEUS_ICS_BLOCK_PRIVATE_IPS:-0}
    - ODYSSEUS_GALLERY_UPLOAD_MAX_BYTES=${ODYSSEUS_GALLERY_UPLOAD_MAX_BYTES:-104857600}
    - ODYSSEUS_GALLERY_TRANSFORM_UPLOAD_MAX_BYTES=${ODYSSEUS_GALLERY_TRANSFORM_UPLOAD_MAX_BYTES:-26214400}
    - ODYSSEUS_MEMORY_IMPORT_MAX_BYTES=${ODYSSEUS_MEMORY_IMPORT_MAX_BYTES:-10485760}
    - ODYSSEUS_PERSONAL_UPLOAD_MAX_BYTES=${ODYSSEUS_PERSONAL_UPLOAD_MAX_BYTES:-26214400}
    - ODYSSEUS_EMAIL_COMPOSE_UPLOAD_MAX_BYTES=${ODYSSEUS_EMAIL_COMPOSE_UPLOAD_MAX_BYTES:-26214400}
    - ODYSSEUS_STT_MAX_AUDIO_BYTES=${ODYSSEUS_STT_MAX_AUDIO_BYTES:-26214400}
    - ODYSSEUS_ICS_MAX_BYTES=${ODYSSEUS_ICS_MAX_BYTES:-10485760}
    - ODYSSEUS_TTS_CACHE_MAX_BYTES=${ODYSSEUS_TTS_CACHE_MAX_BYTES}
    - DATA_BRAVE_API_KEY=${DATA_BRAVE_API_KEY:-}
    - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
    - GOOGLE_PSE_CX=${GOOGLE_PSE_CX:-}
    - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID:-}
    - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET:-}
    - GOOGLE_OAUTH_REDIRECT_URI=${GOOGLE_OAUTH_REDIRECT_URI:-}
    - TAVILY_API_KEY=${TAVILY_API_KEY:-}
    - SERPER_API_KEY=${SERPER_API_KEY:-}
    - PUID=${PUID:-568}
    - PGID=${PGID:-568}
    depends_on:
      searxng:
        condition: service_healthy
      chromadb:
        condition: service_started
    healthcheck:
      test:
      - CMD-SHELL
      - python -c "import urllib.request; urllib.request.urlopen('http://localhost:7000/api/health',
        timeout=5).read(1)"
      interval: 30s
      timeout: 6s
      retries: 5
      start_period: 90s
    restart: unless-stopped
    devices:
    - /dev/kfd
    - /dev/dri
    group_add:
    - video
    - ${RENDER_GID:-render}
  chromadb:
    image: docker.io/chromadb/chroma:latest
    ports:
    - ${CHROMADB_BIND:-127.0.0.1}:8100:8000
    volumes:
    - chromadb-data:/chroma/chroma
    environment:
    - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped
  proton-bridge:
    build:
      context: ${ODYSSEUS_REPO_DIR:-.}
      dockerfile: docker/proton-bridge.Dockerfile
      args:
        PROTON_BRIDGE_BASE: ${PROTON_BRIDGE_IMAGE:-docker.io/shenxn/protonmail-bridge:latest}
    image: ${ODYSSEUS_PROTON_BRIDGE_IMAGE:-odysseus-proton-bridge:local}
    ports:
    - ${PROTON_BRIDGE_BIND:-127.0.0.1}:1143:143
    - ${PROTON_BRIDGE_BIND:-127.0.0.1}:1025:25
    volumes:
    - proton-bridge-data:/root
    restart: unless-stopped
  searxng:
    image: docker.io/searxng/searxng:2026.5.31-7159b8aed
    entrypoint:
    - /bin/sh
    - -c
    - "set -eu\nif [ ! -s /etc/searxng/settings.yml ] || grep -q 'odysseus-local-searxng-json-2026-05-30\\\
      |__SEARXNG_SECRET__' /etc/searxng/settings.yml; then\n  secret=\"$${SEARXNG_SECRET:-}\"\
      \n  if [ -z \"$$secret\" ]; then\n    secret=\"$$(python -c 'import secrets;\
      \ print(secrets.token_urlsafe(48))')\"\n  fi\n  sed \"s|__SEARXNG_SECRET__|$$secret|g\"\
      \ /tmp/searxng-settings.yml.template > /etc/searxng/settings.yml\nfi\nexec /usr/local/searxng/entrypoint.sh\n"
    ports:
    - 127.0.0.1:8181:8080
    volumes:
    - searxng-data:/etc/searxng
    - ${ODYSSEUS_REPO_DIR:-.}/config/searxng/settings.yml:/tmp/searxng-settings.yml.template:ro,z
    environment:
    - SEARXNG_BASE_URL=http://localhost:8181/
    - SEARXNG_SECRET=${SEARXNG_SECRET:-}
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    - SETGID
    - SETUID
    - DAC_OVERRIDE
    healthcheck:
      test:
      - CMD-SHELL
      - python -c "import urllib.request; urllib.request.urlopen('http://localhost:8080/',
        timeout=5).read(1)"
      interval: 5s
      timeout: 6s
      retries: 20
      start_period: 10s
    restart: unless-stopped
  ntfy:
    image: docker.io/binwiederhier/ntfy
    command: serve
    ports:
    - ${NTFY_BIND:-127.0.0.1}:8091:80
    volumes:
    - ntfy-cache:/var/cache/ntfy
    environment:
    - NTFY_BASE_URL=${NTFY_BASE_URL:-http://localhost:8091}
    - NTFY_BEHIND_PROXY=${NTFY_BEHIND_PROXY:-false}
    - NTFY_AUTH_FILE=${NTFY_AUTH_FILE:-/var/cache/ntfy/auth.db}
    - NTFY_AUTH_DEFAULT_ACCESS=${NTFY_AUTH_DEFAULT_ACCESS:-read-write}
    - NTFY_ENABLE_LOGIN=${NTFY_ENABLE_LOGIN:-false}
    - NTFY_UPSTREAM_BASE_URL=${NTFY_UPSTREAM_BASE_URL:-https://ntfy.sh}
    restart: unless-stopped
volumes:
  searxng-data: null
  chromadb-data: null
  proton-bridge-data: null
  ntfy-cache: null
